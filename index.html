<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Market</title>
<!--
  INI BUKAN APLIKASINYA — ini cuma halaman "pintu depan" untuk Vercel. 
  Aplikasi Motor Market yang sebenarnya (login, data motor, dll) TETAP jalan di
  Google Apps Script, bukan di Vercel — karena butuh google.script.run yang cuma
  ada di sana (lihat penjelasan sebelumnya).

  Halaman ini cuma mengarahkan (redirect) pengunjung dari domain Vercel Anda
  ke URL Apps Script yang sebenarnya, supaya Anda bisa punya alamat yang lebih
  pendek/rapi kalau mau.

  KALAU ANDA MEMBUAT DEPLOYMENT BARU (bukan "New version") di Apps Script,
  URL /exec BISA BERUBAH — kalau itu terjadi, ganti nilai APP_URL di bawah ini
  dengan URL /exec yang baru.
-->
<style>
  :root{
    --asphalt:#1c1e22; --asphalt-2:#26292e; --plate-amber:#f2b418;
    --steel-light:#aeb8c2; --paper:#f3f1ea; --line:#383c42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--asphalt); color:var(--paper); font-family:'Segoe UI', Roboto, Arial, sans-serif;
    padding:20px; text-align:center;
  }
  .card{ background:var(--asphalt-2); border:1px solid var(--line); border-radius:10px; padding:32px 28px; max-width:360px; width:100%; }
  .plate{
    display:inline-block; background:var(--plate-amber); color:var(--asphalt); font-weight:800;
    letter-spacing:2px; font-size:18px; padding:6px 12px; border-radius:4px; border:2px solid var(--asphalt);
    font-family:'Courier New', monospace; margin-bottom:18px;
  }
  p{ color:var(--steel-light); font-size:14px; line-height:1.5; margin:0 0 20px; }
  a.btn{
    display:inline-block; background:var(--plate-amber); color:var(--asphalt); text-decoration:none;
    font-weight:700; padding:12px 20px; border-radius:6px; font-size:14px;
  }
  .spinner{
    width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--plate-amber);
    border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="plate">MOTOR MARKET</div>
    <div class="spinner"></div>
    <p>Membuka aplikasi…<br>Kalau tidak otomatis berpindah, klik tombol di bawah.</p>
    <a class="btn" id="fallbackLink" href="#">Buka Motor Market</a>
  </div>

  <script>
    // GANTI nilai ini kalau URL deployment Apps Script Anda berubah.
    var APP_URL = "https://script.google.com/macros/s/AKfycbwOpMQt-lZRV2EmAjvAiIP765AWbLGkZJjgCLfRPcEKSAd6Jt0IriKn_kWVfbhiUq-TcQ/exec";

    document.getElementById('fallbackLink').href = APP_URL;
    window.location.replace(APP_URL);
  </script>
</body>
</html>
